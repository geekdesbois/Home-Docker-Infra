services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    container_name: convertx
    restart: unless-stopped
    environment:
      - TZ= Europe/Paris
      - JWT_SECRET=${CONVERTX_JWT_SECRET}          # variable défitnie directement dans Portainer (Settings > Environment Variables)
      - ACCOUNT_REGISTRATION=false         # true 5 min pour créer ton compte, puis false
      - ALLOW_UNAUTHENTICATED=false
      - HTTP_ALLOWED=false                 # TLS terminé par HAProxy -> cookies Secure OK
      - AUTO_DELETE_EVERY_N_HOURS=6
      - MAX_CONVERT_PROCESS=2
      - HIDE_HISTORY=false
      - LANGUAGE=fr-FR
    ports:
      - "8089:3000/tcp"
    volumes:
      - /docker/convertx/data:/app/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=4g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"