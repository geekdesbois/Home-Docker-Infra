global:
  smtp_smarthost: "blackbox.zonelibre.live:25"
  smtp_from: "monitoring@terre-du-milieu.org"
  smtp_require_tls: false
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "host"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - alertname="Dock01_LVM_Locked_At_Boot"
      receiver: dock01-mail
      repeat_interval: 30m
    - matchers:
        - severity="warning"
      receiver: default
      repeat_interval: 24h

# Nouveau : évite les doublons de mails.
inhibit_rules:
  # DOCK01 bloqué au boot : l'alerte dédiée suffit, on masque TargetDown / HostUnreachable
  - source_matchers:
      - alertname="Dock01_LVM_Locked_At_Boot"
    target_matchers:
      - alertname=~"TargetDown|HostUnreachable"
    equal: ["host"]

  # Hôte injoignable en ICMP : inutile de recevoir en plus les scrapes en échec du même hôte
  - source_matchers:
      - alertname=~"HostUnreachable|HostPingDown"
    target_matchers:
      - alertname=~"TargetDown|DnsUdpDown|DnsTcpDown|AdPortDown"
    equal: ["host"]

  # FS > 95 % masque le "> 90 %" et la prédiction sur le même point de montage
  - source_matchers:
      - alertname="LinuxFilesystemFullCritical"
    target_matchers:
      - alertname=~"LinuxFilesystemAlmostFull|LinuxFilesystemFillsIn24h"
    equal: ["host", "mountpoint"]

  # Datastore > 98 % masque le "> 95 %"
  - source_matchers:
      - alertname="ESXiDatastoreFullCritical"
    target_matchers:
      - alertname="ESXiDatastoreAlmostFull"
    equal: ["ds_name"]

receivers:
  - name: default
    email_configs:
      - to: "geekdesbois@zonelibre.live"
        send_resolved: true
        headers:
          Subject: "[Monitoring] {{ .CommonLabels.alertname }}"

  - name: dock01-mail
    email_configs:
      - to: "geekdesbois@zonelibre.live"
        send_resolved: true
        headers:
          Subject: "[CRITIQUE] DOCK01 – unlock LVM requis"
