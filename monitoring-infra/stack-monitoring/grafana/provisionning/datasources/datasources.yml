apiVersion: 1

# uid figés : ce sont ceux que Grafana a générés automatiquement à partir du nom
# (on les retrouve en dur dans tes dashboards). Les fixer ici évite qu'un
# renommage ou une recréation casse tous les panels.
# Vérifier AVANT d'appliquer :  curl -s -u admin:*** http://dock02-pwr:3000/api/datasources | jq '.[] | {name,uid}'
# Si les uid affichés diffèrent, reporter ceux-là ici.

datasources:
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      prometheusType: Prometheus
      timeInterval: 15s        # = scrape_interval, pour un $__rate_interval correct

  - name: Loki
    uid: P8E80F9AEF21F6940
    type: loki
    access: proxy
    url: http://loki:3100
