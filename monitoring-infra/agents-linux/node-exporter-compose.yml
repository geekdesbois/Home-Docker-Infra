services:
  node_exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/host/var/lib/node_exporter/textfile"      
    ports:
      - "9100:9100"
    volumes:
      - "/:/host:ro,rslave"
      - /var/lib/node_exporter/textfile:/textfile:ro
    restart: unless-stopped
