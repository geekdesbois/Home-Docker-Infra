 #  command:
 #    - --haproxy.scrape-uri=unix:///sock/haproxy.sock
 #  ports:
 #    - "9101:9101/tcp"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    env_file:
      - /etc/portainer-env/dmzsec.env
    restart: unless-stopped
    networks: [dmzsec]
    depends_on: [syslog]
    environment:
      - TZ=${TZ}
      # Collections de base utiles ici
      - COLLECTIONS=crowdsecurity/haproxy
    volumes:
      - /docker/crowdsec/data:/var/lib/crowdsec/data
      - /docker/crowdsec/config:/etc/crowdsec
      - /docker/crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # CrowdSec lit les logs syslog
      - /docker/syslog/log:/var/log:ro
    ports:
      # LAPI (pour bouncer OPNsense)
      - "8888:8080/tcp"
      - "6060:6060/tcp"

networks:
  dmzsec:
    name: dmz-wan
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.90.0/24