services:
  syslog:
    image: balabit/syslog-ng:4.11.0
    container_name: syslog
    restart: unless-stopped
    networks:
      dmzsec:
        ipv4_address: 172.31.90.10    
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - /docker/syslog/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - /docker/syslog/log:/var/log

  haproxy:
    image: haproxy:3.0
    container_name: haproxy
    env_file:
      - /etc/portainer-env/dmzsec.env
    restart: always
    stop_grace_period: 30s
    depends_on: [syslog]
    networks:
      dmzsec:
        ipv4_address: 172.31.90.11    
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "8404:8404/tcp"      
      # Ports TCP futurs (SFTP, etc.) -> à ajouter ici plus tard
      # - "2222:2222/tcp"
    environment:
      - TZ=${TZ}
    volumes:
      - /docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /docker/haproxy/crt-list.txt:/usr/local/etc/haproxy/crt-list.txt:ro
      - /docker/haproxy/certs:/usr/local/etc/haproxy/certs:ro
      - /docker/haproxy/hosts_internal.lst:/usr/local/etc/haproxy/hosts_internal.lst:ro     
      - /docker/haproxy/hosts_known_http.lst:/usr/local/etc/haproxy/hosts_known_http.lst:ro
      - /docker/haproxy/hosts_synology_http.lst:/usr/local/etc/haproxy/hosts_synology_http.lst:ro
  #   - /docker/haproxy/sock:/sock     # Socket pour haproxy-exporter
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8404 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

