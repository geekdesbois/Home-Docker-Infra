global
  maxconn 2000
  tune.bufsize 65536
  hard-stop-after 25s
  # Logs vers syslog-ng container (port 514)
  log 172.31.90.10:514 local0 info

  # Socket admin
  stats socket /tmp/haproxy.socket level admin expose-fd listeners

  # Socket pour haproxy-exporter
# stats socket /sock/haproxy.sock mode 666 level admin expose-fd listeners

  # TLS
  tune.ssl.default-dh-param 2048

  # Applique ces options à TOUS les bind ssl (évite de les répéter et évite les erreurs de parsing)
  ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
  # Ciphers raisonnables (optionnel)
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  option dontlognull

  timeout connect         5s
  timeout client          30s
  timeout server          30s
  timeout http-request    10s
  timeout http-keep-alive 10s
  timeout queue           30s
  timeout check 3s
  default-server inter 10s fastinter 2s downinter 5s fall 3 rise 2  

# ----------------------------
# STATS (pour toi + exporter Prometheus)
# ----------------------------
listen stats
  bind :8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 10s
  stats show-legends
  stats show-node
  monitor-uri /healthz
  http-request use-service prometheus-exporter if { path /metrics }
# ----------------------------
# FE_HTTPS_PUBLIC (TLS termination)
# ----------------------------
frontend FE_HTTPS_PUBLIC
  log global
  mode http
  maxconn 2000

  # IMPORTANT: pas de "\". Tout sur une ligne.
  bind :443 ssl alpn h2,http/1.1 strict-sni crt-list /usr/local/etc/haproxy/crt-list.txt

  # Variables (comme ta conf pfSense)
  http-request set-var(txn.txnhost) hdr(host)
  http-request set-var(txn.txnpath) path


  # ACL hosts
  acl acl_vw_host         var(txn.txnhost) -m str -i secrets.zonelibre.live
  acl is_libretime_host   var(txn.txnhost) -m str -i libretime.nina.fm
  acl is_photos_host      var(txn.txnhost) -m str -i photos.zonelibre.live
  acl is_drive_host       var(txn.txnhost) -m str -i cloud.zonelibre.live
  acl is_cal_host         var(txn.txnhost) -m str -i cal.zonelibre.live
  acl is_card_host        var(txn.txnhost) -m str -i card.zonelibre.live
  acl is_note_host        var(txn.txnhost) -m str -i note.zonelibre.live
  acl is_files_host       var(txn.txnhost) -m str -i files.zonelibre.live
  acl is_pdf_host         var(txn.txnhost) -m str -i pdf.zonelibre.live
  acl is_monitoring_host  var(txn.txnhost) -m str -i monitoring.zonelibre.live
  acl is_dns_host         var(txn.txnhost) -m str -i dns.zonelibre.live
  acl is_firefox_host     var(txn.txnhost) -m str -i firefox.zonelibre.live
  acl is_qbt_host         var(txn.txnhost) -m str -i qbt.zonelibre.live
  acl is_convertx_host    var(txn.txnhost) -m str -i convert.zonelibre.live
  acl is_haproxy_host     hdr(host) -i haproxy.zonelibre.live

  # debug
# http-after-response set-header X-Debug-Src %[src]

  # --- Hosts réservés au LAN / WireGuard ---
  acl src_trusted src 192.168.0.0/24 172.16.70.0/24 172.16.111.0/24
  acl is_internal_only var(txn.txnhost) -m str -i -f /usr/local/etc/haproxy/hosts_internal.lst
  http-request deny deny_status 403 if is_internal_only !src_trusted

  # --- Vaultwarden : /admin réservé au LAN / WireGuard ---
  acl vw_admin_path path,url_dec,lower -m reg (^|/)admin(/|$)
  http-request deny deny_status 403 if acl_vw_host vw_admin_path !src_trusted

  # --- CrowdSec SPOA : décisions IP + WAF AppSec ---
  option http-buffer-request
  unique-id-format %[uuid()]
  filter spoe engine crowdsec config /usr/local/etc/haproxy/crowdsec.cfg

  acl body_within_limit req.body_size -m int le 51200
  http-request send-spoe-group crowdsec crowdsec-http-body    if body_within_limit || !{ req.body_size -m found }
  http-request send-spoe-group crowdsec crowdsec-http-no-body if !body_within_limit { req.body_size -m found }

  http-request deny deny_status 403 if { var(txn.crowdsec.remediation) -m str ban }
  http-request deny deny_status 403 if { var(txn.crowdsec.remediation) -m str captcha }

  # ACL redirect
  acl pihole_root path -i /
  http-request redirect location /admin/ code 302 if is_dns_host pihole_root
  acl haproxy_root path -i /
  http-request redirect location /stats/ code 302 if is_haproxy_host haproxy_root

  # HSTS enable
  http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # Hardening
  http-response set-header X-Frame-Options SAMEORIGIN if !{ res.hdr(X-Frame-Options) -m found }
  http-response set-header X-Content-Type-Options nosniff if !{ res.hdr(X-Content-Type-Options) -m found }
  http-response set-header Referrer-Policy strict-origin-when-cross-origin if !{ res.hdr(Referrer-Policy) -m found }
  http-response del-header X-XSS-Protection

  # Proxy headers “propres”
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Real-IP %[src]
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]

  # Routage
  use_backend be_vaultwarden_http if acl_vw_host
  use_backend be_libretime        if is_libretime_host
  use_backend be_drive            if is_drive_host
  use_backend be_photos           if is_photos_host
  use_backend be_calendar         if is_cal_host
  use_backend be_card             if is_card_host
  use_backend be_filestation      if is_files_host
  use_backend be_note             if is_note_host
  use_backend be_monitoring       if is_monitoring_host
  use_backend be_pdf              if is_pdf_host
  use_backend be_dns              if is_dns_host
  use_backend be_firefox          if is_firefox_host
  use_backend be_qbt              if is_qbt_host
  use_backend be_haproxy_stats    if is_haproxy_host
  use_backend be_convertx         if is_convertx_host


  default_backend BE_DENY_ALL

# ----------------------------
# FE_HTTP_Cert_Renewal (ACME http-01 + redirect HTTPS)
# ----------------------------
frontend FE_HTTP_Cert_Renewal
  log global
  bind :80
  mode http

  http-request set-var(txn.txnhost) hdr(host)
  http-request set-var(txn.txnpath) path

  # normalisation Host
  http-request set-header Host %[req.hdr(Host),lower,field(1,:)]

  # IMPORTANT: hostlists via fichiers (sinon HAProxy prend les FQDN pour des directives)
  acl is_synology_host  var(txn.txnhost) -m str -i -f /usr/local/etc/haproxy/hosts_synology_http.lst
  acl is_known_host     var(txn.txnhost) -m str -i -f /usr/local/etc/haproxy/hosts_known_http.lst
  acl is_libretime_host var(txn.txnhost) -m str -i libretime.nina.fm
  acl is_acme_challenge var(txn.txnpath) -m beg -i /.well-known/acme-challenge/

  # host connu : challenge -> backend; sinon deny + redirect
  # http-request deny deny_status 403 if is_known_host !is_acme_challenge
  # http-request redirect scheme https code 301 if is_known_host !is_acme_challenge

  # Host connu => redirect HTTPS
  http-request redirect scheme https code 301 if is_known_host !is_acme_challenge
  # Sinon => refuse
  http-request deny deny_status 403 if !is_acme_challenge

  # ACME HTTP-01 (uniquement)
  use_backend be_acme_syno      if is_synology_host is_acme_challenge
  use_backend be_acme_libretime if is_libretime_host is_acme_challenge

  default_backend BE_DENY_ALL

# ----------------------------
# BACKENDS
# ----------------------------
backend crowdsec-spoa
  mode tcp
  timeout connect 2s
  timeout server  60s
  server spoa 172.31.90.12:9000

backend be_vaultwarden_http
  mode http
  option httpchk
  http-check send meth GET uri /alive
  retries 3
  timeout connect 5s
  timeout server  30s
  timeout tunnel 1h

  # WebSockets: ne pas forcer, seulement si demandé
  acl ws_upgrade hdr(Upgrade) -i websocket
  http-request set-header Connection "upgrade" if ws_upgrade
  http-request set-header Upgrade "websocket"  if ws_upgrade

  server dock01_vaultwarden_http 172.16.70.11:11001 check

backend be_libretime
  mode http
  option httpchk
  http-check send meth GET uri /
  retries 3
  timeout connect 5s
  timeout server  30s
  timeout tunnel 1h
  option http-server-close

  server srv_libretime 172.16.20.1:8080 check

backend be_drive
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host cloud.zonelibre.live
  http-check expect status 200-399
  retries 3
  timeout connect 5s
  timeout server  1800s
  timeout tunnel 1h
  option http-server-close

  http-request set-header Host cloud.zonelibre.live
  server blackbox 172.16.70.3:555 ssl verify none check inter 30s

backend be_photos
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host photos.zonelibre.live
  http-check expect status 200-399  
  retries 3
  timeout connect 5s
  timeout server  1800s
  timeout tunnel 1h
  option http-server-close

  http-request set-header Host photos.zonelibre.live
  server blackbox 172.16.70.3:333 ssl verify none check inter 30s

backend be_calendar
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host cal.zonelibre.live
  http-check expect status 200-399
  retries 3
  timeout connect 5s
  timeout server  600s
  timeout tunnel 1h
  option http-server-close

  http-request set-header Host cal.zonelibre.live
  server blackbox 172.16.70.3:777 ssl verify none check inter 30s

backend be_card
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host card.zonelibre.live
  http-check expect status 200-399
  retries 3
  timeout connect 5s
  timeout server  600s

  http-request set-header Host card.zonelibre.live
  server blackbox 172.16.70.3:888 ssl verify none check inter 30s

backend be_filestation
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host files.zonelibre.live
  http-check expect status 200-399
  retries 3
  timeout connect 5s
  timeout server  1800s
  timeout tunnel 1h
  option http-server-close

  http-request set-header Host files.zonelibre.live
  server blackbox 172.16.70.3:7001 ssl verify none check inter 30s

backend be_note
  mode http
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host note.zonelibre.live
  http-check expect status 200-399
  retries 3
  timeout connect 5s
  timeout server  1200s
  timeout tunnel 1h
  option http-server-close

  http-request set-header Host note.zonelibre.live
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]
  server blackbox 172.16.70.3:444 ssl verify none check inter 30s

backend be_monitoring
  mode http
  option httpchk
  http-check send meth GET uri /api/health
  retries 3
  timeout connect 5s
  timeout server  30s
  timeout tunnel 1h
  option http-server-close

  server dock02_grafana 172.16.70.12:3000 check

backend be_pdf
  mode http
  option httpchk
  http-check send meth GET uri /login
  retries 3
  timeout connect 5s
  timeout server  30s
  timeout tunnel 1h
  option http-server-close

  server dock01_stirling_pdf 172.16.70.11:8088 check

backend be_convertx
  mode http
  option httpchk
  http-check send meth GET uri / hdr Host convert.zonelibre.live hdr X-Forwarded-Proto https
  retries 3
  timeout connect 5s
  timeout server  1800s
  timeout tunnel  1h
  http-reuse safe

  server dock01_convertx 172.16.70.11:8089 check maxconn 20

backend be_dns
  mode http
  option httpchk
  http-check send meth GET uri /admin
  timeout connect 5s
  timeout server  30s
  option http-server-close

  server dock00-sec_pihole 172.16.90.1:8003 ssl verify none check

backend be_firefox
  mode http
  option httpchk GET /
  http-check expect rstatus ^(200|401)$
  timeout connect 5s
  timeout server  1h
  timeout tunnel  1h
  http-reuse never

  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 443

  server dock03-dl_firefox 172.16.40.10:3001 ssl verify none check alpn http/1.1

backend be_qbt
  mode http
  option httpchk GET /
  http-check expect status 200
  timeout connect 5s
  timeout server  1m
  timeout tunnel  1h
  http-reuse safe
  # Headers utiles pour app proxifiée
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host %[req.hdr(host)]
  http-request set-header X-Forwarded-For %[src]

  server dock03_dl_qbt 172.16.40.10:8888 check



backend be_haproxy_stats
  mode http
  server haproxy_stats 172.16.90.1:8404 check

backend BE_DENY_ALL
  mode http
  http-request deny status 403

backend be_acme_syno
  mode http
  timeout connect 5s
  timeout server  30s
  server blackbox 172.16.70.3:80

backend be_acme_libretime
  mode http
  timeout connect 5s
  timeout server  30s
  server NINA_LT 172.16.20.1:80
